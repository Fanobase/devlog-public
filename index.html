<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title></title>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #gate { display: flex; align-items: center; justify-content: center; height: 100vh; }
  #gate form { display: flex; flex-direction: column; gap: 10px; min-width: 240px; }
  #gate input, #gate button { padding: 10px; font-size: 16px; }
  #err { color: #c33; min-height: 1.2em; font-size: 14px; }
  #frame { border: 0; width: 100%; height: 100vh; display: none; }
</style>
</head>
<body>
<div id="gate">
  <form id="f">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button type="submit">Unlock</button>
    <div id="err"></div>
  </form>
</div>
<iframe id="frame" sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-top-navigation-by-user-activation"></iframe>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let pages = null;

  async function unlock(password) {
    const buf = new Uint8Array(await (await fetch('data.bin')).arrayBuffer());
    const salt = buf.slice(0, 16), iv = buf.slice(16, 28), ct = buf.slice(28);
    const km = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    pages = JSON.parse(new TextDecoder().decode(pt));
  }

  // At render time, inject a <base> so /css/style.css etc. resolve against
  // the parent origin, plus a tiny click interceptor that routes #/ links
  // to parent.location.hash and opens external links in a new tab.
  const INJECT = origin => `<base href="${origin}/"><script>document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href');if(h&&h.startsWith('#/')){e.preventDefault();parent.location.hash=h;}else if(h&&(/^https?:/i.test(h)||h.startsWith('//'))){e.preventDefault();window.open(h,'_blank','noopener');}});<\/script>`;

  function render() {
    if (!pages) return;
    const id = location.hash.replace(/^#\//, '') || 'home';
    let html = pages[id];
    if (!html) { $('frame').srcdoc = '<p style="font-family:system-ui;padding:2em">Not found.</p>'; return; }
    html = html.replace(/<head[^>]*>/i, m => m + INJECT(location.origin));
    $('frame').srcdoc = html;
  }

  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    $('err').textContent = '';
    try {
      await unlock($('pw').value);
      $('gate').style.display = 'none';
      $('frame').style.display = 'block';
      render();
      addEventListener('hashchange', render);
    } catch {
      $('err').textContent = 'Wrong password.';
    }
  });
})();
</script>
</body>
</html>
