name: Cancel stale Pages deployments

# When a new commit is pushed to gh-pages, cancel any previously queued
# "pages build and deployment" runs for older SHAs.  Those stale queued
# runs hold an un-started deployment record in the GitHub Pages API; if
# they are not cleared before the new deploy job runs, the Pages API
# immediately rejects the new deployment with "Deployment failed, try
# again later."
on:
  push:
    branches: [gh-pages]

permissions:
  actions: write

concurrency:
  group: cancel-stale-pages-${{ github.sha }}
  cancel-in-progress: false

jobs:
  cancel-stale:
    name: Cancel stale queued Pages runs
    runs-on: ubuntu-latest
    steps:
      - name: Cancel queued 'pages build and deployment' runs for older SHAs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs" \
            --paginate \
            --jq '[
              .workflow_runs[]
              | select(
                  .name == "pages build and deployment"
                  and .status == "queued"
                  and .head_sha != "${{ github.sha }}"
                )
              | {id: .id, sha: .head_sha}
            ][]' \
          | jq -r '"\(.id) \(.sha)"' \
          | while read -r run_id run_sha; do
              echo "Cancelling stale queued run $run_id (SHA $run_sha)"
              gh run cancel "$run_id" \
                --repo "${{ github.repository }}" || true
            done
